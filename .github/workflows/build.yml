name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK. The old
      # setup-android@v3 action tries to install the retired "tools" package.
      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager unavailable on this runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test 96 race configurations and replay consistency
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/marble-physics"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/marble-physics" \
            tests/android/graphics/Bitmap.java \
            app/src/main/java/com/viniison/marblerace/RaceEngine.java \
            tests/com/viniison/marblerace/RaceEngineSmokeTest.java
          java -cp "$RUNNER_TEMP/marble-physics" com.viniison.marblerace.RaceEngineSmokeTest

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarbleRace-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
